<!doctype html>
<html><body style="margin:0">
<pre id="out">pending</pre>
<script>
const sizes = [[1920,1080],[1440,900],[1280,720],[1199,800],[1024,768],[991,800],[820,1000],[768,1000],[600,900],[480,850],[390,844],[360,740],[320,640]];
const res = {};
const wait = ms => new Promise(r => setTimeout(r, ms));
async function run([W,H]) {
  const f = document.createElement('iframe');
  f.style.cssText = `width:${W}px;height:${H}px;border:0`; f.src = '/';
  document.body.appendChild(f);
  await new Promise(r => f.addEventListener('load', r, { once: true }));
  await wait(2500);
  const w = f.contentWindow, d = w.document;
  const sec = d.querySelector('#projects');
  const rows = d.querySelectorAll('.fp-row');
  w.__lenis ? w.__lenis.scrollTo(rows[0].getBoundingClientRect().top + w.scrollY - 150, { immediate: true }) : 0;
  await wait(1500);
  // click the 3rd visible tab
  const tabs = [...d.querySelectorAll('.fp-tab')].filter(t => t.offsetParent);
  tabs[2].click();
  await wait(3500);
  const landed = Math.round(rows[2].getBoundingClientRect().top);
  const activeTab = [...d.querySelectorAll('.fp-tab.is-active')].filter(t => t.offsetParent).map(t => t.textContent.trim().slice(0, 14));
  const sr = sec.getBoundingClientRect();
  const outside = [], clipped = [], small = new Set(), taps = [];
  sec.querySelectorAll('*').forEach(el => {
    if (el.closest('.fp-tabs-top, .fp-screen')) return;
    const r = el.getBoundingClientRect();
    if (r.width && (r.right > sr.right + 1 || r.left < sr.left - 1)) outside.push((el.className || el.tagName).toString().split(' ')[0]);
  });
  sec.querySelectorAll('.fp-title, .fp-desc, .fp-quote, .fp-meta dd, .fp-card-text strong, .fp-more-sub').forEach(el => {
    if (el.scrollWidth > el.clientWidth + 2) clipped.push(el.className + ':' + el.textContent.trim().slice(0, 18));
  });
  sec.querySelectorAll('*').forEach(el => {
    if (el.closest('svg') || !el.childNodes.length) return;
    if (![...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim())) return;
    const cs = w.getComputedStyle(el); if (cs.display === 'none') return;
    const fs = parseFloat(cs.fontSize); if (fs < 11) small.add((el.className || el.tagName).toString().split(' ')[0] + '=' + fs);
  });
  sec.querySelectorAll('.fp-tab, .fp-card, a.k-btn').forEach(el => {
    if (!el.offsetParent) return;
    const r = el.getBoundingClientRect(); if (r.width && r.height < 40) taps.push((el.className || '').split(' ')[0] + ' ' + Math.round(r.height));
  });
  const grid = d.querySelector('.fp-more-grid').getBoundingClientRect();
  const cont = d.querySelector('#projects .container');
  const cs = w.getComputedStyle(cont);
  const inner = cont.getBoundingClientRect().right - parseFloat(cs.paddingRight);
  res[`${W}x${H}`] = {
    overflowX: d.documentElement.scrollWidth - w.innerWidth,
    outside: [...new Set(outside)].slice(0, 5), clipped: clipped.slice(0, 5), under11: [...small].slice(0, 5), shortTaps: taps.slice(0, 5),
    tabClickLandedTop: landed, activeTab,
    cards: d.querySelectorAll('.fp-card').length,
    gridCols: w.getComputedStyle(d.querySelector('.fp-more-grid')).gridTemplateColumns.split(' ').length,
    gridRightGap: Math.round(inner - grid.right),
    bg: w.getComputedStyle(sec).backgroundColor,
  };
  f.remove();
}
(async () => { for (const s of sizes) { try { await run(s); } catch (e) { res[s.join('x')] = 'ERR ' + e.message; } } document.getElementById('out').textContent = JSON.stringify(res); })();
</script>
</body></html>
